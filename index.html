<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrainerTracker - PSG CAS</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f5f7;--surface:#fff;--border:#dde1e7;--text:#1a1d23;--muted:#6b7280;
  --accent:#2563eb;--accent-h:#1d4ed8;--green:#16a34a;--amber:#d97706;--red:#dc2626;
  --blue:#2563eb;--grey:#6b7280;--radius:6px;--shadow:0 1px 3px rgba(0,0,0,.08);--nav-w:224px;
}
body{font-family:system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg);display:flex;min-height:100vh}
#nav{width:var(--nav-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto}
#nav .brand{padding:18px 16px 12px;font-weight:700;font-size:15px;color:var(--accent);border-bottom:1px solid var(--border)}
#nav .brand span{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
#nav ul{list-style:none;padding:8px 0;flex:1}
#nav ul li a{display:block;padding:8px 16px;color:var(--text);text-decoration:none;transition:background .15s}
#nav ul li a:hover{background:var(--bg)}
#nav ul li a.active{background:#eff6ff;color:var(--accent);font-weight:600}
#nav .section-label{padding:14px 16px 4px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
#main{margin-left:var(--nav-w);flex:1;padding:28px 32px;max-width:1120px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:20px;font-weight:700}
.page-head .sub{font-size:13px;color:var(--muted);margin-top:3px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--accent-h)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.ghost:hover{background:#eff6ff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{background:var(--red)}.btn.danger:hover{background:#b91c1c}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-head h2{font-size:15px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:16px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat .n{font-size:28px;font-weight:700}.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:#f9fafb}
tr:hover td{background:#fafbff}
td.actions a{color:var(--accent);text-decoration:none;margin-right:10px;font-size:12px;cursor:pointer}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.badge.green{background:#dcfce7;color:#166534}.badge.amber{background:#fef3c7;color:#92400e}
.badge.red{background:#fee2e2;color:#991b1b}.badge.blue{background:#dbeafe;color:#1e40af}
.badge.grey{background:#f3f4f6;color:#4b5563}.badge.purple{background:#f3e8ff;color:#6b21a8}
.tag{display:inline-block;padding:2px 7px;background:#eff6ff;color:var(--accent);border-radius:4px;font-size:11px;margin:2px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
.filters select,.filters input{padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--text);background:var(--surface);min-width:140px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid.single{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
label.lbl{font-size:12px;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=email],input[type=number],select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--text);background:var(--surface);width:100%}
textarea{resize:vertical;min-height:70px}
.form-actions{margin-top:20px;display:flex;gap:10px}
.error-msg{color:var(--red);font-size:12px;margin-top:8px}
.hidden{display:none!important}
.score-table td input{padding:5px 8px;width:80px}
.score-table .max-lbl{color:var(--muted);font-size:12px}
.score-total{font-weight:600;margin-top:10px;font-size:13px}
.empty{color:var(--muted);font-size:13px;padding:20px 0;text-align:center}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.80);display:flex;align-items:center;justify-content:center;z-index:9999}
.spin-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.spinner{width:40px;height:40px;border:3px solid #dde1e7;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-text{font-size:13px;font-weight:500;color:var(--accent);letter-spacing:.03em}
#toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:10px 18px;border-radius:var(--radius);font-size:13px;z-index:9998;display:none}
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;display:flex;align-items:center;justify-content:center}
#modal-box{background:var(--surface);border-radius:var(--radius);padding:24px;width:90%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18)}
#modal-box h2{font-size:16px;margin-bottom:16px}
.jump{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.jump a{font-size:12px;color:var(--accent);text-decoration:none}
.jump a:hover{text-decoration:underline}
/* eval score comparison table */
.eval-grid th.eval-col{min-width:110px}
.avg-row td{font-weight:600;background:#f9fafb}
.info-row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:16px}
.info-row .info-item{font-size:13px}.info-row .info-item span{font-weight:600}

.shimmer{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:4px;height:14px;margin:6px 0}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.page-enter{animation:fadeSlide .18s ease}
@keyframes fadeSlide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<nav id="nav">
  <div class="brand">TrainerTracker<span>PSG CAS</span></div>
  <ul>
    <li><a href="#" data-page="dashboard">Dashboard</a></li>
    <div class="section-label">Trainers</div>
    <li><a href="#" data-page="trainers">All Trainers</a></li>
    <li><a href="#" data-page="active">Active Trainers</a></li>
    <div class="section-label">Demos</div>
    <li><a href="#" data-page="schedule-demo">Schedule Demo</a></li>
    <li><a href="#" data-page="scheduled">Scheduled Demos</a></li>
    <li><a href="#" data-page="evaluated">Evaluated Demos</a></li>
    <li><a href="#" data-page="followups">Follow-ups (Redo)</a></li>
    <div class="section-label">Records</div>
    <li><a href="#" data-page="add-feedback">Add Feedback</a></li>
    <div class="section-label">Admin</div>
    <li><a href="#" data-page="modules">Modules</a></li>
    <li><a href="#" data-page="vendors">Vendors</a></li>
    <li><a href="#" data-page="fields">Evaluation Fields</a></li>
    <li><a href="#" data-page="evaluators">Evaluators</a></li>
  </ul>
</nav>
<main id="main"></main>
<div id="loading"><div class="spin-wrap"><div class="spinner"></div><div class="spin-text">Loading…</div></div></div>
<div id="toast"></div>
<div id="modal-overlay" class="hidden"><div id="modal-box"></div></div>

<script>
// ════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════
const API = "https://script.google.com/macros/s/AKfycbz-LLf0V0RzmnS31XV4Ykm8dqGHiCJvOpPmAPqa1DfNJzM9oqoiAKHXhVZPCFupn1A-/exec";

// ── state ─────────────────────────────────────────────────────
let DB = { vendors:[], modules:[], fields:[], evaluators:[], trainers:[], engagements:[], demos:[], evaluations:[], evaluationscores:[], decisions:[], feedback:[] };

const PAGE_SHEETS = {
  dashboard:       ["trainers","engagements","demos","evaluations","decisions"],
  trainers:        ["trainers","engagements","vendors","decisions","modules"],
  active:          ["trainers","engagements","vendors","decisions","modules"],
  scheduled:       ["demos","trainers","modules","evaluations"],
  evaluated:       ["demos","trainers","modules","evaluations","evaluationscores","fields"],
  followups:       ["demos","trainers","modules"],
  "schedule-demo": ["trainers","modules","vendors","engagements"],
  "demo-detail":   ["demos","trainers","modules","evaluators","evaluations","evaluationscores","fields"],
  "add-feedback":  ["trainers"],
  "trainer-detail":["trainers","engagements","vendors","demos","evaluations","decisions","modules","feedback"],
  modules:         ["modules"],
  vendors:         ["vendors"],
  fields:          ["fields","modules"],
  evaluators:      ["evaluators"]
};

// ── utils ─────────────────────────────────────────────────────
const $  = id => document.getElementById(id);
const el = (tag,cls="",html="") => { const e=document.createElement(tag); if(cls)e.className=cls; if(html)e.innerHTML=html; return e; };
const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt = d => d ? String(d).slice(0,10).split("-").reverse().join("-") : "-";
const fmtToday = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const isTrue = v => v===true||v==="TRUE"||v==="true";

function showLoading(v){ $("loading").style.display=v?"flex":"none"; }
function showToast(msg,dur=3000){ const t=$("toast"); t.textContent=msg; t.style.display="block"; setTimeout(()=>t.style.display="none",dur); }

// ── API ───────────────────────────────────────────────────────
async function apiGet(action) {
  const r = await fetch(API+"?action="+action);
  const j = await r.json();
  if(!j.ok) throw new Error(j.error);
  return j.data;
}
async function apiCall(payload) {
  const params = new URLSearchParams();
  Object.keys(payload).forEach(k => {
    const v = payload[k];
    params.append(k, (typeof v==="object"&&v!==null) ? JSON.stringify(v) : String(v===undefined||v===null?"":v));
  });
  const r = await fetch(API+"?"+params.toString());
  const j = await r.json();
  if(!j.ok) throw new Error(j.error);
  return j.data;
}

async function loadSheets(names) {
  const toFetch = names.filter(n => !DB._loaded || !DB._loaded.has(n));
  if (!toFetch.length) return;
  // if everything is needed and nothing loaded yet, use bulk fetch
  const allKeys = Object.keys(DB).filter(k => k !== "_loaded");
  const needsAll = allKeys.every(k => toFetch.includes(k));
  if (needsAll) {
    const data = await apiGet("all");
    Object.keys(data).forEach(k => { DB[k] = data[k]; });
    if (!DB._loaded) DB._loaded = new Set();
    allKeys.forEach(k => DB._loaded.add(k));
  } else {
    const results = await Promise.all(toFetch.map(n => apiGet(n)));
    toFetch.forEach((n, i) => { DB[n] = results[i]; });
    if (!DB._loaded) DB._loaded = new Set();
    toFetch.forEach(n => DB._loaded.add(n));
  }
}

async function loadAll(sheetsToRefresh) {
  // if specific sheets given, only invalidate those
  if (sheetsToRefresh && sheetsToRefresh.length) {
    sheetsToRefresh.forEach(k => DB._loaded && DB._loaded.delete(k));
  } else {
    if (DB._loaded) DB._loaded.clear();
  }
  await loadPageSheets(currentPage, currentParams);
}

let currentPage = "dashboard", currentParams = {};

async function loadPageSheets(page, params) {
  const needed = PAGE_SHEETS[page] || Object.keys(DB).filter(k => k !== "_loaded");
  showLoading(true);
  try { await loadSheets(needed); } catch(e) { alert("Could not load data: " + e.message); }
  showLoading(false);
}


// ── router ────────────────────────────────────────────────────
function nav(page, params={}) {
  currentPage = page; currentParams = params;
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.page===page));
  const m = $("main"); m.innerHTML=""; m.className="page-enter";
  // show shimmer while loading
  m.innerHTML = `<div style="padding:20px"><div class="shimmer" style="width:40%;height:22px;margin-bottom:18px"></div>${[...Array(4)].map(()=>'<div class="shimmer"></div>').join("")}</div>`;
  loadPageSheets(page, params).then(() => {
    m.innerHTML = ""; m.className = "page-enter";
    const pages = { dashboard, trainers, active, scheduled, evaluated, followups,
      "schedule-demo": scheduleDemoPage, "demo-detail": demoDetail,
      "add-feedback": addFeedbackPage, "trainer-detail": trainerDetail,
      modules, vendors, fields, evaluators };
    if (pages[page]) pages[page](m, params);
    else m.innerHTML = "<p>Page not found.</p>";
  });
}
document.querySelectorAll("#nav a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); nav(a.dataset.page); }));

function openModal(html){ $("modal-box").innerHTML=html; $("modal-overlay").classList.remove("hidden"); }
function closeModal(){ $("modal-overlay").classList.add("hidden"); }
$("modal-overlay").addEventListener("click", e => { if(e.target===$("modal-overlay")) closeModal(); });

// ════════════════════════════════════════════════════════════
// Logic helpers
// ════════════════════════════════════════════════════════════
const activeModules  = () => DB.modules.filter(m=>isTrue(m.Active));
const activeVendors  = () => DB.vendors.filter(v=>isTrue(v.Active));
const activeTrainers = () => DB.trainers.filter(t=>isTrue(t.Active));
const activeEvaluators = () => DB.evaluators.filter(e=>isTrue(e.Active));

function currentEngagement(tid) {
  return DB.engagements.find(e=>String(e.TrainerID)===String(tid)&&(!e.EndDate||e.EndDate===""))||null;
}
function trainerDecisions(tid) {
  return DB.decisions.filter(d=>String(d.TrainerID)===String(tid));
}

function levelCells(decisions, modules) {
  const sorted = [...decisions].sort((a,b)=>{
    const da=new Date(a.EffectiveDate),db=new Date(b.EffectiveDate);
    return da-db||Number(a.DecisionID)-Number(b.DecisionID);
  });
  const cells={};
  modules.forEach(m=>{ cells[String(m.ModuleID)]={UG:null,PG:null}; });
  sorted.forEach(d=>{
    const levels=(!d.Level||d.Level==="ALL")?["UG","PG"]:[d.Level];
    const all=!d.ModuleID||d.ModuleID==="";
    modules.forEach(m=>{
      const mid=String(m.ModuleID);
      if(!all&&String(d.ModuleID)!==mid) return;
      levels.forEach(lv=>{
        const cur=cells[mid][lv];
        if(cur&&cur.Status==="PERM_REJECT"&&d.DemoID&&d.Status!=="PERM_REJECT") return;
        cells[mid][lv]=d;
      });
    });
  });
  return cells;
}

function approvedItems(decisions, modules) {
  const cells=levelCells(decisions,modules);
  return modules.reduce((acc,m)=>{
    const mid=String(m.ModuleID),cell=cells[mid]||{};
    const levels=["UG","PG"].filter(lv=>cell[lv]&&cell[lv].Status==="SELECTED");
    if(levels.length) acc.push({module:m,levels});
    return acc;
  },[]);
}
function approvalTags(items){ return items.map(i=>i.module.Name+" ("+(i.levels.length===2?"All":i.levels[0])+")"); }

function rejectedModulesList(decisions, modules) {
  const cells=levelCells(decisions,modules);
  return modules.filter(m=>{
    const mid=String(m.ModuleID),cell=cells[mid]||{};
    return cell.UG&&cell.UG.Status==="PERM_REJECT"&&cell.PG&&cell.PG.Status==="PERM_REJECT";
  });
}

function trainerStatus(decisions, modules) {
  if(!decisions.length) return "NONE";
  const cells=levelCells(decisions,modules);
  let rejCount=0,psgAll=true;
  modules.forEach(m=>{
    const mid=String(m.ModuleID),cell=cells[mid]||{};
    const ugPerm=cell.UG&&cell.UG.Status==="PERM_REJECT";
    const pgPerm=cell.PG&&cell.PG.Status==="PERM_REJECT";
    if(ugPerm&&pgPerm){
      rejCount++;
      if((cell.UG&&String(cell.UG.ModuleID)!=="")||(cell.PG&&String(cell.PG.ModuleID)!=="")) psgAll=false;
    } else psgAll=false;
  });
  if(rejCount===0) return "ACTIVE";
  if(rejCount===modules.length&&psgAll) return "PERM_REJECT_ALL";
  return "PERM_REJECT_MODULES";
}

function pendingRedos() {
  // demos with DECIDED status and REDO outcome where no later decided demo exists for same trainer+module
  const groups={};
  DB.demos.filter(d=>d.Status==="DECIDED").forEach(d=>{
    const key=d.TrainerID+"_"+d.ModuleID;
    const cur=groups[key];
    if(!cur||new Date(d.DemoDate)>new Date(cur.DemoDate)||
       (d.DemoDate===cur.DemoDate&&Number(d.DemoID)>Number(cur.DemoID))) groups[key]=d;
  });
  return Object.values(groups).filter(d=>d.Outcome==="REDO");
}

function completedRedos() {
  const groups={};
  DB.demos.filter(d=>d.Status==="DECIDED").forEach(d=>{
    const key=d.TrainerID+"_"+d.ModuleID;
    if(!groups[key]) groups[key]=[];
    groups[key].push(d);
  });
  const completed=[];
  Object.values(groups).forEach(demos=>{
    const sorted=demos.sort((a,b)=>new Date(b.DemoDate)-new Date(a.DemoDate)||Number(b.DemoID)-Number(a.DemoID));
    if(sorted[0].Outcome!=="REDO"&&sorted.some(d=>d.Outcome==="REDO")) completed.push(sorted[0]);
  });
  return completed;
}

const trainerName  = id => { const t=DB.trainers.find(x=>String(x.TrainerID)===String(id)); return t?t.Name:"Unknown"; };
const moduleName   = id => { const m=DB.modules.find(x=>String(x.ModuleID)===String(id));   return m?m.Name:"Unknown"; };
const vendorName   = id => { const v=DB.vendors.find(x=>String(x.VendorID)===String(id));   return v?v.Name:"Unknown"; };
const evaluatorName= id => { const e=DB.evaluators.find(x=>String(x.EvaluatorID)===String(id)); return e?e.Name:"Unknown"; };

const demoBadge = d => {
  if(d.Status==="SCHEDULED") return "blue";
  if(d.Status==="EVALUATED") return "purple";
  if(d.Status==="DECIDED"){
    return {SELECTED:"green",REJECTED:"amber",REDO:"blue",PERM_REJECT:"red"}[d.Outcome]||"grey";
  }
  return "grey";
};
const demoStatusLabel = d => {
  if(d.Status==="SCHEDULED") return "Scheduled";
  if(d.Status==="EVALUATED") return "Awaiting decision";
  if(d.Status==="DECIDED"){
    if(d.Outcome==="SELECTED") return "Selected"+(d.Level&&d.Level!=="ALL"?" ("+d.Level+")":"");
    if(d.Outcome==="PERM_REJECT") return d.RejectScope==="PSG"?"Rejected for PSG":"Rejected for module";
    if(d.Outcome==="REJECTED") return "Rejected";
    if(d.Outcome==="REDO") return "Redo";
  }
  return d.Status||"-";
};

// ════════════════════════════════════════════════════════════
// Pages
// ════════════════════════════════════════════════════════════

// ── Dashboard ─────────────────────────────────────────────────
function dashboard(m) {
  const mods=activeModules();
  const engs={};
  DB.engagements.forEach(e=>{ if(!e.EndDate||e.EndDate==="") engs[String(e.TrainerID)]=e; });
  let active=0,psgRej=0;
  activeTrainers().forEach(t=>{
    const dec=trainerDecisions(t.TrainerID),status=trainerStatus(dec,mods);
    if(status==="ACTIVE"&&engs[String(t.TrainerID)]) active++;
    if(status==="PERM_REJECT_ALL") psgRej++;
  });
  const today=fmtToday();
  const scheduled=DB.demos.filter(d=>d.Status==="SCHEDULED");
  const scheduledToday=scheduled.filter(d=>String(d.DemoDate).slice(0,10)===today);
  const awaitingDecision=DB.demos.filter(d=>d.Status==="EVALUATED");
  const redos=pendingRedos();

  m.innerHTML=`
    <div class="page-head"><div><h1>Dashboard</h1><div class="sub">PSG CAS Trainer Management</div></div></div>
    <div class="stats">
      <div class="stat"><div class="n">${active}</div><div class="l">Active Trainers</div></div>
      <div class="stat"><div class="n">${scheduledToday.length}</div><div class="l">Demos Today</div></div>
      <div class="stat"><div class="n">${scheduled.length}</div><div class="l">Scheduled Demos</div></div>
      <div class="stat"><div class="n">${awaitingDecision.length}</div><div class="l">Awaiting Decision</div></div>
      <div class="stat"><div class="n">${redos.length}</div><div class="l">Pending Redos</div></div>
      <div class="stat"><div class="n">${psgRej}</div><div class="l">PSG Rejected</div></div>
    </div>
    ${awaitingDecision.length?`<div class="card">
      <div class="card-head"><h2>Awaiting Decision (${awaitingDecision.length})</h2><a class="btn sm ghost" href="#" onclick="nav('scheduled');return false;">View all</a></div>
      <div class="tbl-wrap"><table>
        <tr><th>Trainer</th><th>Module</th><th>Date</th><th>Evaluations</th><th></th></tr>
        ${awaitingDecision.slice(0,5).map(d=>{
          const evalCount=DB.evaluations.filter(ev=>String(ev.DemoID)===String(d.DemoID)).length;
          return `<tr>

window.sdFilterTrainers = function() {
  const vendorID = $("sd-vendor").value;
  const sel = $("sd-trainer");
  if (!vendorID) {
    sel.innerHTML = `<option value="">-- select vendor first --</option>`;
    sel.disabled = true;
    return;
  }
  // find trainers currently engaged with this vendor
  const matched = activeTrainers().filter(t => {
    const eng = currentEngagement(t.TrainerID);
    return eng && String(eng.VendorID) === vendorID;
  });
  if (!matched.length) {
    sel.innerHTML = `<option value="">No trainers for this vendor</option>`;
    sel.disabled = true;
    return;
  }
  sel.innerHTML = `<option value="">-- select trainer --</option>` +
    matched.map(t => `<option value="${t.TrainerID}">${esc(t.Name)}</option>`).join("");
  sel.disabled = false;
};

window.submitScheduleDemo = async function() {
  const trainer=$("sd-trainer").value, module=$("sd-module").value, errEl=$("sd-err");
  if(!trainer||!module){ errEl.textContent="Trainer and Module are required."; errEl.classList.remove("hidden"); return; }
  try {
    showLoading(true);
    await apiCall({action:"scheduleDemo", TrainerID:trainer, ModuleID:module, Topic:$("sd-topic").value.trim(), DemoDate:$("sd-date").value});
    await loadAll(["demos"]); showToast("Demo scheduled."); nav("scheduled");
  } catch(e){ errEl.textContent=e.message; errEl.classList.remove("hidden"); }
  showLoading(false);
};

// ── Demo Detail (evaluate + decide) ──────────────────────────
function demoDetail(m, params={}) {
  const did=String(params.id);
  const demo=DB.demos.find(d=>String(d.DemoID)===did);
  if(!demo){ m.innerHTML="<p>Demo not found.</p>"; return; }

  const evals=DB.evaluations.filter(ev=>String(ev.DemoID)===did);
  const mods=activeModules();
  const modFields=DB.fields.filter(f=>String(f.ModuleID)===String(demo.ModuleID)&&isTrue(f.Active))
    .sort((a,b)=>Number(a.DisplayOrder)-Number(b.DisplayOrder));

  // build per-evaluator score maps
  const evalScoreMap={}; // evalId -> {fieldId -> score}
  DB.evaluationscores.forEach(sc=>{
    const ev=evals.find(e=>String(e.EvalID)===String(sc.EvalID));
    if(!ev) return;
    if(!evalScoreMap[sc.EvalID]) evalScoreMap[sc.EvalID]={};
    evalScoreMap[sc.EvalID][String(sc.FieldID)]=sc;
  });

  // scores comparison table
  let scoresHtml="";
  if(evals.length&&modFields.length){
    const totals=evals.map(ev=>{
      let s=0,mx=0;
      modFields.forEach(f=>{
        const sc=evalScoreMap[ev.EvalID]?.[String(f.FieldID)];
        s+=sc?Number(sc.Score):0; mx+=Number(f.MaxMarks);
      });
      return {score:s,max:mx};
    });
    scoresHtml=`<div class="card">
      <div class="card-head"><h2>Evaluation Scores</h2></div>
      <div class="tbl-wrap"><table class="eval-grid">
        <tr>
          <th>Criterion</th>
          ${evals.map(ev=>`<th class="eval-col">${esc(evaluatorName(ev.EvaluatorID))}</th>`).join("")}
          ${evals.length>1?`<th>Average</th>`:""}
        </tr>
        ${modFields.map(f=>{
          const scores=evals.map(ev=>evalScoreMap[ev.EvalID]?.[String(f.FieldID)]);
          const vals=scores.map(sc=>sc?Number(sc.Score):"-");
          const nums=vals.filter(v=>v!=="-");
          const avg=nums.length?Math.round(nums.reduce((a,b)=>a+b,0)/nums.length*10)/10:"-";
          return `<tr>
            <td><b>${esc(f.Criterion)}</b> <span class="muted" style="font-size:11px">/ ${f.MaxMarks}</span></td>
            ${vals.map(v=>`<td>${v}</td>`).join("")}
            ${evals.length>1?`<td>${avg}</td>`:""}
          </tr>`;
        }).join("")}
        <tr class="avg-row">
          <td>Total</td>
          ${totals.map(t=>`<td>${t.score} / ${t.max} <span class="muted">(${t.max?Math.round(t.score/t.max*100):0}%)</span></td>`).join("")}
          ${evals.length>1?`<td>${totals.length?Math.round(totals.reduce((a,t)=>a+t.score,0)/totals.length*10)/10:"-"} avg</td>`:""}
        </tr>
      </table></div>
      ${evals.map(ev=>`<div style="margin-top:12px;font-size:13px"><b>${esc(evaluatorName(ev.EvaluatorID))}:</b> ${esc(ev.Remarks)||'<span class="muted">No remarks</span>'}</div>`).join("")}
    </div>`;
  } else if(evals.length&&!modFields.length){
    scoresHtml=`<div class="card"><div class="card-head"><h2>Evaluations (${evals.length})</h2></div>
      ${evals.map(ev=>`<div style="margin-bottom:12px;font-size:13px"><b>${esc(evaluatorName(ev.EvaluatorID))}</b> - ${esc(ev.Remarks)||"No remarks"}</div>`).join("")}
    </div>`;
  }

  // evaluate form (if SCHEDULED or EVALUATED - can always add more)
  let evaluateHtml="";
  if(demo.Status==="SCHEDULED"){
    const evalOptions=activeEvaluators().map(e=>`<option value="${e.EvaluatorID}">${esc(e.Name)}</option>`).join("");
    evaluateHtml=`<div class="card" id="sec-evaluate">
      <div class="card-head"><h2>Submit Evaluation</h2></div>
      <div class="form-grid">
        <div class="field full">
          <label class="lbl">Evaluator *</label>
          <select id="ev-evaluator"><option value="">-- select --</option>${evalOptions}</select>
        </div>
        ${modFields.length?`
        <div class="field full">
          <div class="tbl-wrap"><table class="score-table" id="ev-score-table">
            <tr><th>Criterion</th><th>Score</th><th>Max</th></tr>
            ${modFields.map(f=>`<tr class="score-row" data-field-id="${f.FieldID}" data-max="${f.MaxMarks}" data-min="${f.MinMarks}" data-criterion="${esc(f.Criterion)}">
              <td>${esc(f.Criterion)}</td>
              <td><input type="number" min="${f.MinMarks}" max="${f.MaxMarks}" step="1" value="${f.MinMarks}" oninput="calcEvalTotal()"></td>
              <td class="max-lbl">/ ${f.MaxMarks}</td>
            </tr>`).join("")}
          </table></div>
          <div class="score-total" id="ev-total"></div>
        </div>`:""}
        <div class="field full"><label class="lbl">Remarks</label><textarea id="ev-remarks"></textarea></div>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="submitEvaluation('${did}')">Submit Evaluation</button>
      </div>
      <div class="error-msg hidden" id="ev-err"></div>
    </div>`;
  }

  // decide form (if EVALUATED)
  let decideHtml="";
  if(demo.Status==="EVALUATED"){
    decideHtml=`<div class="card" id="sec-decide">
      <div class="card-head"><h2>Set Final Outcome</h2></div>
      <div class="form-grid">
        <div class="field">
          <label class="lbl">Outcome *</label>
          <select id="dec-outcome" onchange="toggleDecideFields()">
            <option value="">-- select --</option>
            <option value="SELECTED">Selected</option>
            <option value="REJECTED">Rejected (may present again)</option>
            <option value="REDO">Redo</option>
            <option value="PERM_REJECT">Permanent reject</option>
          </select>
        </div>
        <div class="field hidden" id="dec-level-row">
          <label class="lbl">Selected for *</label>
          <select id="dec-level">
            <option value="ALL">All (UG &amp; PG)</option>
            <option value="UG">UG</option>
            <option value="PG">PG</option>
          </select>
        </div>
        <div class="field hidden" id="dec-scope-row">
          <label class="lbl">Rejected for *</label>
          <select id="dec-scope">
            <option value="MODULE">This module only</option>
            <option value="PSG">PSG (all modules, permanent)</option>
          </select>
        </div>
        <div class="field">
          <label class="lbl">Decided by</label>
          <select id="dec-by"><option value="">-- select --</option>${activeEvaluators().map(e=>`<option value="${e.Name}">${esc(e.Name)}</option>`).join("")}</select>
        </div>
        <div class="field full"><label class="lbl">Final Remarks</label><textarea id="dec-remarks"></textarea></div>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="submitDecide('${did}','${demo.TrainerID}')">Confirm Outcome</button>
      </div>
      <div class="error-msg hidden" id="dec-err"></div>
    </div>`;
  }

  // decided summary
  let decidedHtml="";
  if(demo.Status==="DECIDED"){
    decidedHtml=`<div class="card">
      <div class="card-head"><h2>Final Outcome</h2></div>
      <div class="info-row">
        <div class="info-item">Outcome: <span><span class="badge ${demoBadge(demo)}">${esc(demoStatusLabel(demo))}</span></span></div>
        ${demo.DecidedBy?`<div class="info-item">Decided by: <span>${esc(demo.DecidedBy)}</span></div>`:""}
      </div>
      ${demo.FinalRemarks?`<div style="font-size:13px;margin-top:4px">${esc(demo.FinalRemarks)}</div>`:""}
    </div>`;
  }

  m.innerHTML=`
    <div class="page-head">
      <div>
        <h1>${esc(trainerName(demo.TrainerID))} - ${esc(moduleName(demo.ModuleID))}</h1>
        <div class="sub">${fmt(demo.DemoDate)}${demo.Topic?" · "+esc(demo.Topic):""} · <span class="badge ${demoBadge(demo)}">${demoStatusLabel(demo)}</span></div>
      </div>
      <a class="btn ghost sm" href="#" onclick="nav('trainer-detail',{id:'${demo.TrainerID}'});return false;">← Trainer</a>
    </div>
    ${decidedHtml}
    ${scoresHtml}
    ${evaluateHtml}
    ${decideHtml}
  `;
  if(modFields.length) calcEvalTotal();
}

window.calcEvalTotal = function() {
  const tot=$("ev-total"); if(!tot) return;
  let score=0,max=0;
  document.querySelectorAll("#ev-score-table .score-row").forEach(tr=>{
    score+=Number(tr.querySelector("input").value)||0;
    max+=Number(tr.dataset.max)||0;
  });
  tot.textContent=max?`Total: ${score} / ${max} (${Math.round(score/max*100)}%)`:"";
};

window.toggleDecideFields = function() {
  const outcome=$("dec-outcome").value;
  $("dec-level-row").classList.toggle("hidden", outcome!=="SELECTED");
  $("dec-scope-row").classList.toggle("hidden", outcome!=="PERM_REJECT");
};

window.submitEvaluation = async function(did) {
  const evaluatorID=$("ev-evaluator").value, errEl=$("ev-err");
  if(!evaluatorID){ errEl.textContent="Please select an evaluator."; errEl.classList.remove("hidden"); return; }
  const scores=[];
  document.querySelectorAll("#ev-score-table .score-row").forEach(tr=>{
    scores.push({FieldID:tr.dataset.fieldId, Criterion:tr.dataset.criterion, Score:Number(tr.querySelector("input").value)||0, MinAtTime:Number(tr.dataset.min), MaxAtTime:Number(tr.dataset.max)});
  });
  try {
    showLoading(true);
    await apiCall({action:"submitEvaluation", DemoID:did, EvaluatorID:evaluatorID, Remarks:$("ev-remarks").value.trim(), Scores:scores});
    await loadAll(["demos","evaluations","evaluationscores"]); showToast("Evaluation submitted."); nav("demo-detail",{id:did});
  } catch(e){ errEl.textContent=e.message; errEl.classList.remove("hidden"); }
  showLoading(false);
};

window.submitDecide = async function(did, trainerID) {
  const outcome=$("dec-outcome").value, errEl=$("dec-err");
  if(!outcome){ errEl.textContent="Please select an outcome."; errEl.classList.remove("hidden"); return; }
  if(outcome==="PERM_REJECT"&&!$("dec-remarks").value.trim()){ errEl.textContent="Please write the reason for a permanent rejection."; errEl.classList.remove("hidden"); return; }
  try {
    showLoading(true);
    await apiCall({action:"decideDemo", DemoID:did, Outcome:outcome, Level:outcome==="SELECTED"?$("dec-level").value:"ALL", RejectScope:outcome==="PERM_REJECT"?$("dec-scope").value:"", DecidedBy:$("dec-by").value, FinalRemarks:$("dec-remarks").value.trim()});
    await loadAll(["demos","decisions"]); showToast("Outcome recorded.");
    nav("trainer-detail",{id:trainerID});
  } catch(e){ errEl.textContent=e.message; errEl.classList.remove("hidden"); }
  showLoading(false);
};

// ── Evaluated Demos ────────────────────────────────────────────
function evaluated(m, params={}) {
  const moduleFilter  = params.module  || "";
  const trainerFilter = params.trainer || "";
  const statusFilter  = params.status  || "";
  const dateFrom      = params.from    || "";
  const dateTo        = params.to      || "";

  function demoAvgScore(did) {
    const evals = DB.evaluations.filter(ev => String(ev.DemoID) === String(did));
    if (!evals.length) return null;
    const allScores = DB.evaluationscores.filter(sc => evals.some(ev => String(ev.EvalID) === String(sc.EvalID)));
    if (!allScores.length) return null;
    const evalTotals = evals.map(ev => {
      const s = DB.evaluationscores.filter(sc => String(sc.EvalID) === String(ev.EvalID));
      return s.reduce((a, sc) => a + Number(sc.Score), 0);
    });
    return Math.round(evalTotals.reduce((a, b) => a + b, 0) / evalTotals.length * 10) / 10;
  }

  let list = DB.demos.filter(d =>
    d.Status === "EVALUATED" || d.Status === "DECIDED"
  );

  if (moduleFilter)  list = list.filter(d => String(d.ModuleID)  === moduleFilter);
  if (trainerFilter) list = list.filter(d => String(d.TrainerID) === trainerFilter);
  if (statusFilter)  list = list.filter(d => d.Status === statusFilter || (statusFilter === "DECIDED" && d.Status === "DECIDED" && !d.Outcome) || (statusFilter !== "" && (d.Status === statusFilter || d.Outcome === statusFilter)));
  if (dateFrom)      list = list.filter(d => String(d.DemoDate).slice(0,10) >= dateFrom);
  if (dateTo)        list = list.filter(d => String(d.DemoDate).slice(0,10) <= dateTo);

  list.sort((a, b) => new Date(b.DemoDate) - new Date(a.DemoDate) || Number(b.DemoID) - Number(a.DemoID));

  m.innerHTML = `
    <div class="page-head"><div><h1>Evaluated Demos</h1><div class="sub">${list.length} result${list.length !== 1 ? "s" : ""}</div></div></div>
    <div class="filters">
      <label>Module<select id="ev-f-module">
        <option value="">All</option>
        ${activeModules().map(mod => `<option value="${mod.ModuleID}" ${moduleFilter === String(mod.ModuleID) ? "selected" : ""}>${esc(mod.Name)}</option>`).join("")}
      </select></label>
      <label>Trainer<select id="ev-f-trainer">
        <option value="">All</option>
        ${DB.trainers.filter(t => isTrue(t.Active)).map(t => `<option value="${t.TrainerID}" ${trainerFilter === String(t.TrainerID) ? "selected" : ""}>${esc(t.Name)}</option>`).join("")}
      </select></label>
      <label>Status<select id="ev-f-status">
        <option value="">All</option>
        <option value="EVALUATED" ${statusFilter === "EVALUATED" ? "selected" : ""}>Awaiting decision</option>
        <option value="DECIDED" ${statusFilter === "DECIDED" ? "selected" : ""}>Decided</option>
      </select></label>
      <label>From<input type="date" id="ev-f-from" value="${dateFrom}"></label>
      <label>To<input type="date" id="ev-f-to" value="${dateTo}"></label>
      <button class="btn" onclick="nav('evaluated',{module:$('ev-f-module').value,trainer:$('ev-f-trainer').value,status:$('ev-f-status').value,from:$('ev-f-from').value,to:$('ev-f-to').value})">Filter</button>
      <a class="btn ghost" href="#" onclick="nav('evaluated');return false;">Clear</a>
    </div>
    <div class="card"><div class="tbl-wrap"><table>
      <tr><th>Date</th><th>Trainer</th><th>Module</th><th>Topic</th><th>Status</th><th>Evaluators</th><th>Avg Score</th><th></th></tr>
      ${list.map(d => {
        const evalCount = DB.evaluations.filter(ev => String(ev.DemoID) === String(d.DemoID)).length;
        const avg = demoAvgScore(d.DemoID);
        return `<tr>
          <td>${fmt(d.DemoDate)}</td>
          <td><a href="#" onclick="nav('trainer-detail',{id:'${d.TrainerID}'});return false;">${esc(trainerName(d.TrainerID))}</a></td>
          <td>${esc(moduleName(d.ModuleID))}</td>
          <td>${esc(d.Topic)}</td>
          <td><span class="badge ${demoBadge(d)}">${esc(demoStatusLabel(d))}</span></td>
          <td>${evalCount}</td>
          <td>${avg !== null ? avg : '<span class="muted">-</span>'}</td>
          <td class="actions"><a href="#" onclick="nav('demo-detail',{id:'${d.DemoID}'});return false;">View →</a></td>
        </tr>`;
      }).join("") || `<tr><td colspan="8" class="empty">No evaluated demos found.</td></tr>`}
    </table></div></div>
  `;
}

function active(m, params={}) {
  const mods=activeModules();
  const statusFilter=params.status||"active";
  const vendorFilter=params.vendor||"";
  const moduleFilter=params.module||"";
  const typeFilter=params.type||"";
  const rows=[];

  activeTrainers().forEach(t=>{
    const eng=currentEngagement(t.TrainerID);
    const dec=trainerDecisions(t.TrainerID);
    const status=trainerStatus(dec,mods);
    const items=approvedItems(dec,mods);
    const tags=approvalTags(items);
    const rejMods=rejectedModulesList(dec,mods);
    const statusMatch=statusFilter==="active"?(status==="ACTIVE"&&eng):statusFilter==="psg"?status==="PERM_REJECT_ALL":statusFilter==="module"?status==="PERM_REJECT_MODULES":true;
    if(!statusMatch) return;
    if(vendorFilter&&eng&&String(eng.VendorID)!==vendorFilter) return;
    if(typeFilter&&eng&&eng.Type!==typeFilter) return;
    if(moduleFilter&&!items.some(i=>String(i.module.ModuleID)===moduleFilter)) return;
    rows.push({t,eng,status,tags,rejMods});
  });

  m.innerHTML=`
    <div class="page-head">
      <div><h1>Active Trainers</h1></div>
      <button class="btn ghost sm" onclick="exportActiveCSV()">Download CSV</button>
    </div>
    <div class="filters">
      <label>Status<select id="f-status">
        <option value="active" ${statusFilter==="active"?"selected":""}>Active</option>
        <option value="psg" ${statusFilter==="psg"?"selected":""}>PSG Rejected</option>
        <option value="module" ${statusFilter==="module"?"selected":""}>Module Rejected</option>
        <option value="all" ${statusFilter==="all"?"selected":""}>All</option>
      </select></label>
      <label>Vendor<select id="f-vendor"><option value="">All</option>${DB.vendors.map(v=>`<option value="${v.VendorID}" ${vendorFilter==String(v.VendorID)?"selected":""}>${esc(v.Name)}</option>`).join("")}</select></label>
      <label>Module<select id="f-module"><option value="">All</option>${mods.map(mod=>`<option value="${mod.ModuleID}" ${moduleFilter==String(mod.ModuleID)?"selected":""}>${esc(mod.Name)}</option>`).join("")}</select></label>
      <label>Type<select id="f-type"><option value="">All</option><option value="FT" ${typeFilter==="FT"?"selected":""}>Full-time</option><option value="FL" ${typeFilter==="FL"?"selected":""}>Freelancer</option></select></label>
      <button class="btn" onclick="nav('active',{status:$('f-status').value,vendor:$('f-vendor').value,module:$('f-module').value,type:$('f-type').value})">Filter</button>
      <a class="btn ghost" href="#" onclick="nav('active');return false;">Clear</a>
    </div>
    <div class="card"><div class="tbl-wrap"><table>
      <tr><th>Trainer</th><th>Vendor</th><th>Type</th><th>With us since</th><th>Status</th><th>Approved modules</th><th>Rejected modules</th><th>Phone</th></tr>
      ${rows.map(({t,eng,status,tags,rejMods})=>{
        const badge=status==="ACTIVE"?"green":status==="PERM_REJECT_ALL"?"red":"amber";
        const label=status==="ACTIVE"?"Active":status==="PERM_REJECT_ALL"?"PSG Rejected":"Module Rejected";
        return `<tr>
          <td><a href="#" onclick="nav('trainer-detail',{id:'${t.TrainerID}'});return false;"><b>${esc(t.Name)}</b></a></td>
          <td>${eng?esc(vendorName(eng.VendorID)):"-"}</td>
          <td>${eng?(eng.Type==="FT"?"Full-time":"Freelancer"):"-"}</td>
          <td>${eng?fmt(eng.StartDate):"-"}</td>
          <td><span class="badge ${badge}">${label}</span></td>
          <td>${tags.map(tg=>`<span class="tag">${esc(tg)}</span>`).join("")||'<span class="muted">-</span>'}</td>
          <td>${rejMods.map(mm=>`<span class="tag">${esc(mm.Name)}</span>`).join("")||'<span class="muted">-</span>'}</td>
          <td>${esc(t.Phone||"")}</td>
        </tr>`;
      }).join("")||`<tr><td colspan="8" class="empty">No trainers match this filter.</td></tr>`}
    </table></div></div>
  `;
}

window.exportActiveCSV = function() {
  const mods=activeModules();
  const rows=[["Trainer","Phone","Email","Vendor","Type","With us since","Status","Approved modules","Rejected modules"]];
  activeTrainers().forEach(t=>{
    const eng=currentEngagement(t.TrainerID);
    const dec=trainerDecisions(t.TrainerID);
    const status=trainerStatus(dec,mods);
    const tags=approvalTags(approvedItems(dec,mods));
    const rejMods=rejectedModulesList(dec,mods);
    const label=status==="ACTIVE"?"Active":status==="PERM_REJECT_ALL"?"PSG Rejected":"Module Rejected";
    rows.push([t.Name,t.Phone||"",t.Email||"",eng?vendorName(eng.VendorID):"",eng?(eng.Type==="FT"?"Full-time":"Freelancer"):"",eng?eng.StartDate:"",label,tags.join("; "),rejMods.map(mm=>mm.Name).join("; ")]);
  });
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}));
  a.download="active_trainers.csv"; a.click();
};
