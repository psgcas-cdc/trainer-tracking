<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrainerTracker — PSG CAS</title>
<style>
/* ── reset & tokens ─────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #f4f5f7;
  --surface:  #ffffff;
  --border:   #dde1e7;
  --text:     #1a1d23;
  --muted:    #6b7280;
  --accent:   #2563eb;
  --accent-h: #1d4ed8;
  --green:    #16a34a;
  --amber:    #d97706;
  --red:      #dc2626;
  --blue:     #2563eb;
  --grey:     #6b7280;
  --radius:   6px;
  --shadow:   0 1px 3px rgba(0,0,0,.08);
  --nav-w:    220px;
}
body { font-family: system-ui, sans-serif; font-size: 14px; color: var(--text); background: var(--bg); display: flex; min-height: 100vh; }

/* ── nav ────────────────────────────────────────── */
#nav {
  width: var(--nav-w); background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; overflow-y: auto;
}
#nav .brand { padding: 18px 16px 12px; font-weight: 700; font-size: 15px; color: var(--accent); border-bottom: 1px solid var(--border); }
#nav .brand span { display: block; font-weight: 400; font-size: 11px; color: var(--muted); margin-top: 2px; }
#nav ul { list-style: none; padding: 8px 0; flex: 1; }
#nav ul li a { display: block; padding: 8px 16px; color: var(--text); text-decoration: none; border-radius: 0; transition: background .15s; }
#nav ul li a:hover { background: var(--bg); }
#nav ul li a.active { background: #eff6ff; color: var(--accent); font-weight: 600; }
#nav .section-label { padding: 14px 16px 4px; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

/* ── main ───────────────────────────────────────── */
#main { margin-left: var(--nav-w); flex: 1; padding: 28px 32px; max-width: 1100px; }

/* ── page head ──────────────────────────────────── */
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { font-size: 20px; font-weight: 700; }
.page-head .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* ── buttons ────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; transition: background .15s; }
.btn:hover { background: var(--accent-h); }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn.ghost:hover { background: #eff6ff; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.danger { background: var(--red); }
.btn.danger:hover { background: #b91c1c; }

/* ── cards ──────────────────────────────────────── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.card-head h2 { font-size: 15px; font-weight: 600; }

/* ── stat row ───────────────────────────────────── */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; margin-bottom: 20px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.stat .n { font-size: 28px; font-weight: 700; }
.stat .l { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ── table ──────────────────────────────────────── */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; background: #f9fafb; }
tr:hover td { background: #fafbff; }
td.actions { white-space: nowrap; }
td.actions a { color: var(--accent); text-decoration: none; margin-right: 10px; font-size: 12px; cursor: pointer; }

/* ── badges & tags ──────────────────────────────── */
.badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
.badge.green  { background: #dcfce7; color: #166534; }
.badge.amber  { background: #fef3c7; color: #92400e; }
.badge.red    { background: #fee2e2; color: #991b1b; }
.badge.blue   { background: #dbeafe; color: #1e40af; }
.badge.grey   { background: #f3f4f6; color: #4b5563; }
.tag { display: inline-block; padding: 2px 7px; background: #eff6ff; color: var(--accent); border-radius: 4px; font-size: 11px; margin: 2px; }

/* ── filters ────────────────────────────────────── */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
.filters label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); }
.filters select, .filters input { padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; color: var(--text); background: var(--surface); min-width: 140px; }

/* ── forms ──────────────────────────────────────── */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid.single { grid-template-columns: 1fr; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full { grid-column: 1 / -1; }
label.lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
input[type=text], input[type=date], input[type=email], input[type=number], select, textarea {
  padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 13px; color: var(--text); background: var(--surface); width: 100%;
}
textarea { resize: vertical; min-height: 70px; }
.form-actions { margin-top: 20px; display: flex; gap: 10px; }
.error-msg { color: var(--red); font-size: 12px; margin-top: 4px; }
.hidden { display: none !important; }

/* ── score table ────────────────────────────────── */
.score-table td input { padding: 5px 8px; width: 80px; }
.score-table .max-lbl { color: var(--muted); font-size: 12px; }
.score-total { font-weight: 600; margin-top: 10px; }

/* ── empty ──────────────────────────────────────── */
.empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }

/* ── loading ────────────────────────────────────── */
#loading { position: fixed; inset: 0; background: rgba(255,255,255,.7); display: flex; align-items: center; justify-content: center; z-index: 9999; font-size: 15px; color: var(--accent); }
#toast { position: fixed; bottom: 24px; right: 24px; background: #1e293b; color: #fff; padding: 10px 18px; border-radius: var(--radius); font-size: 13px; z-index: 9998; display: none; }

/* ── modal ──────────────────────────────────────── */
#modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 200; display: flex; align-items: center; justify-content: center; }
#modal-box { background: var(--surface); border-radius: var(--radius); padding: 24px; width: 90%; max-width: 560px; max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,.18); }
#modal-box h2 { font-size: 16px; margin-bottom: 16px; }

/* ── jump links ─────────────────────────────────── */
.jump { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.jump a { font-size: 12px; color: var(--accent); text-decoration: none; }
.jump a:hover { text-decoration: underline; }
</style>
</head>
<body>

<!-- NAV -->
<nav id="nav">
  <div class="brand">TrainerTracker<span>PSG CAS</span></div>
  <ul>
    <li><a href="#" data-page="dashboard">Dashboard</a></li>
    <div class="section-label">Trainers</div>
    <li><a href="#" data-page="trainers">All Trainers</a></li>
    <li><a href="#" data-page="active">Active Trainers</a></li>
    <li><a href="#" data-page="followups">Follow-ups (Redo)</a></li>
    <div class="section-label">Records</div>
    <li><a href="#" data-page="add-demo">Add Demo</a></li>
    <li><a href="#" data-page="add-feedback">Add Feedback</a></li>
    <div class="section-label">Admin</div>
    <li><a href="#" data-page="modules">Modules</a></li>
    <li><a href="#" data-page="vendors">Vendors</a></li>
    <li><a href="#" data-page="fields">Evaluation Fields</a></li>
  </ul>
</nav>

<main id="main"></main>
<div id="loading">Loading…</div>
<div id="toast"></div>
<div id="modal-overlay" class="hidden"><div id="modal-box"></div></div>

<script>
// ════════════════════════════════════════════════════════════
// CONFIG — paste your Apps Script /exec URL here
// ════════════════════════════════════════════════════════════
const API = "https://script.google.com/a/macros/psgcas.ac.in/s/AKfycbz-LLf0V0RzmnS31XV4Ykm8dqGHiCJvOpPmAPqa1DfNJzM9oqoiAKHXhVZPCFupn1A-/exec";

// ── state ────────────────────────────────────────────────────
let DB = { vendors:[], modules:[], fields:[], trainers:[], engagements:[], demos:[], demoscores:[], decisions:[], feedback:[] };
let loading = false;
let currentPage = "dashboard";

// ── utility ──────────────────────────────────────────────────
const $  = id => document.getElementById(id);
const el = (tag, cls="", html="") => { const e=document.createElement(tag); if(cls) e.className=cls; if(html) e.innerHTML=html; return e; };
const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt = d => d ? String(d).slice(0,10).split("-").reverse().join(" ") : "-";
const fmtToday = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

function showLoading(v){ $("loading").style.display = v ? "flex" : "none"; }
function showToast(msg, dur=3000){ const t=$("toast"); t.textContent=msg; t.style.display="block"; setTimeout(()=>t.style.display="none", dur); }

// ── API calls ─────────────────────────────────────────────────
async function apiGet(action) {
  const r = await fetch(API + "?action=" + action);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}

async function apiPost(payload) {
  const r = await fetch(API, {
    method: "POST",
    body: JSON.stringify(payload)
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}

// ── load all data ─────────────────────────────────────────────
async function loadAll() {
  showLoading(true);
  try {
    const [vendors, modules, fields, trainers, engagements, demos, demoscores, decisions, feedback] = await Promise.all([
      apiGet("vendors"), apiGet("modules"), apiGet("fields"), apiGet("trainers"),
      apiGet("engagements"), apiGet("demos"), apiGet("demoscores"), apiGet("decisions"), apiGet("feedback")
    ]);
    DB = { vendors, modules, fields, trainers, engagements, demos, demoscores, decisions, feedback };
  } catch(e) { alert("Could not load data: " + e.message); }
  showLoading(false);
}

// ── router ────────────────────────────────────────────────────
function nav(page, params={}) {
  currentPage = page;
  document.querySelectorAll("#nav a").forEach(a => {
    a.classList.toggle("active", a.dataset.page === page);
  });
  const m = $("main");
  m.innerHTML = "";
  const pages = { dashboard, trainers, active, followups, "add-demo": addDemoPage, "add-feedback": addFeedbackPage, modules, vendors, fields, "trainer-detail": trainerDetail };
  if (pages[page]) pages[page](m, params);
  else m.innerHTML = "<p>Page not found.</p>";
}

document.querySelectorAll("#nav a").forEach(a => {
  a.addEventListener("click", e => { e.preventDefault(); nav(a.dataset.page); });
});

// ── modal ─────────────────────────────────────────────────────
function openModal(html) {
  $("modal-box").innerHTML = html;
  $("modal-overlay").classList.remove("hidden");
}
function closeModal() { $("modal-overlay").classList.add("hidden"); }
$("modal-overlay").addEventListener("click", e => { if (e.target === $("modal-overlay")) closeModal(); });

// ════════════════════════════════════════════════════════════
// Logic helpers (mirrors of Apps Script)
// ════════════════════════════════════════════════════════════

function activeModules()  { return DB.modules.filter(m => m.Active === true || m.Active === "TRUE" || m.Active === "true"); }
function activeVendors()  { return DB.vendors.filter(v => v.Active === true || v.Active === "TRUE" || v.Active === "true"); }
function activeTrainers() { return DB.trainers.filter(t => t.Active === true || t.Active === "TRUE" || t.Active === "true"); }

function currentEngagement(trainerID) {
  return DB.engagements.find(e => String(e.TrainerID) === String(trainerID) && (!e.EndDate || e.EndDate === "")) || null;
}

function trainerDecisions(trainerID) {
  return DB.decisions.filter(d => String(d.TrainerID) === String(trainerID));
}

function levelCells(decisions, modules) {
  const sorted = [...decisions].sort((a,b) => {
    const da = new Date(a.EffectiveDate), db = new Date(b.EffectiveDate);
    if (da-db !== 0) return da-db;
    return Number(a.DecisionID) - Number(b.DecisionID);
  });
  const cells = {};
  modules.forEach(m => { cells[String(m.ModuleID)] = { UG: null, PG: null }; });
  sorted.forEach(d => {
    const levels = (!d.Level || d.Level === "ALL") ? ["UG","PG"] : [d.Level];
    const appliesToAll = !d.ModuleID || d.ModuleID === "";
    modules.forEach(m => {
      const mid = String(m.ModuleID);
      if (!appliesToAll && String(d.ModuleID) !== mid) return;
      levels.forEach(lv => {
        const cur = cells[mid][lv];
        if (cur && cur.Status === "PERM_REJECT" && d.DemoID && d.Status !== "PERM_REJECT") return;
        cells[mid][lv] = d;
      });
    });
  });
  return cells;
}

function approvedItems(decisions, modules) {
  const cells = levelCells(decisions, modules);
  const result = [];
  modules.forEach(m => {
    const mid = String(m.ModuleID);
    const cell = cells[mid] || {};
    const levels = ["UG","PG"].filter(lv => cell[lv] && cell[lv].Status === "SELECTED");
    if (levels.length) result.push({ module: m, levels });
  });
  return result;
}

function approvalTags(items) {
  return items.map(i => i.module.Name + " (" + (i.levels.length === 2 ? "All" : i.levels[0]) + ")");
}

function rejectedModulesList(decisions, modules) {
  const cells = levelCells(decisions, modules);
  return modules.filter(m => {
    const mid = String(m.ModuleID);
    const cell = cells[mid] || {};
    return cell["UG"] && cell["UG"].Status === "PERM_REJECT" && cell["PG"] && cell["PG"].Status === "PERM_REJECT";
  });
}

function trainerStatus(decisions, modules) {
  if (!decisions.length) return "NONE";
  const cells = levelCells(decisions, modules);
  let rejCount = 0, psgAll = true;
  modules.forEach(m => {
    const mid = String(m.ModuleID);
    const cell = cells[mid] || {};
    const ugPerm = cell["UG"] && cell["UG"].Status === "PERM_REJECT";
    const pgPerm = cell["PG"] && cell["PG"].Status === "PERM_REJECT";
    if (ugPerm && pgPerm) {
      rejCount++;
      if ((cell["UG"] && String(cell["UG"].ModuleID) !== "") || (cell["PG"] && String(cell["PG"].ModuleID) !== "")) psgAll = false;
    } else { psgAll = false; }
  });
  if (rejCount === 0) return "ACTIVE";
  if (rejCount === modules.length && psgAll) return "PERM_REJECT_ALL";
  return "PERM_REJECT_MODULES";
}

function pendingRedos() {
  const groups = {};
  DB.demos.forEach(d => {
    const key = d.TrainerID + "_" + d.ModuleID;
    const cur = groups[key];
    if (!cur || new Date(d.DemoDate) > new Date(cur.DemoDate) || (d.DemoDate === cur.DemoDate && Number(d.DemoID) > Number(cur.DemoID)))
      groups[key] = d;
  });
  return Object.values(groups).filter(d => d.Outcome === "REDO");
}

function completedRedos() {
  // For each trainer+module, if the latest demo is NOT redo but there was a redo before, it's completed
  const groups = {};
  DB.demos.forEach(d => {
    const key = d.TrainerID + "_" + d.ModuleID;
    if (!groups[key]) groups[key] = [];
    groups[key].push(d);
  });
  const completed = [];
  Object.values(groups).forEach(demos => {
    const sorted = demos.sort((a,b) => new Date(b.DemoDate)-new Date(a.DemoDate) || Number(b.DemoID)-Number(a.DemoID));
    const latest = sorted[0];
    if (latest.Outcome !== "REDO" && sorted.some(d => d.Outcome === "REDO")) {
      completed.push(latest);
    }
  });
  return completed;
}

function trainerName(id) { const t = DB.trainers.find(x => String(x.TrainerID) === String(id)); return t ? t.Name : "Unknown"; }
function moduleName(id)  { const m = DB.modules.find(x => String(x.ModuleID) === String(id)); return m ? m.Name : "Unknown"; }
function vendorName(id)  { const v = DB.vendors.find(x => String(x.VendorID) === String(id)); return v ? v.Name : "Unknown"; }

// ════════════════════════════════════════════════════════════
// Pages
// ════════════════════════════════════════════════════════════

// ── Dashboard ─────────────────────────────────────────────────
function dashboard(m) {
  const mods = activeModules();
  const trainers = activeTrainers();
  const engs = {};
  DB.engagements.forEach(e => { if (!e.EndDate || e.EndDate === "") engs[String(e.TrainerID)] = e; });

  let active = 0, psgRej = 0;
  trainers.forEach(t => {
    const dec = trainerDecisions(t.TrainerID);
    const status = trainerStatus(dec, mods);
    if (status === "ACTIVE" && engs[String(t.TrainerID)]) active++;
    if (status === "PERM_REJECT_ALL") psgRej++;
  });
  const redos = pendingRedos();

  m.innerHTML = `
    <div class="page-head"><div><h1>Dashboard</h1><div class="sub">Overview — PSG CAS Trainer Management</div></div></div>
    <div class="stats">
      <div class="stat"><div class="n">${active}</div><div class="l">Active Trainers</div></div>
      <div class="stat"><div class="n">${trainers.length}</div><div class="l">Total Trainers</div></div>
      <div class="stat"><div class="n">${redos.length}</div><div class="l">Pending Redos</div></div>
      <div class="stat"><div class="n">${psgRej}</div><div class="l">PSG Rejected</div></div>
      <div class="stat"><div class="n">${mods.length}</div><div class="l">Active Modules</div></div>
      <div class="stat"><div class="n">${DB.demos.length}</div><div class="l">Total Demos</div></div>
    </div>
    ${redos.length ? `<div class="card"><div class="card-head"><h2>Pending Redo Demos</h2><a class="btn sm ghost" href="#" onclick="nav('followups');return false;">View all</a></div>
    <div class="tbl-wrap"><table>
      <tr><th>Trainer</th><th>Module</th><th>Topic</th><th>Demo Date</th><th></th></tr>
      ${redos.slice(0,5).map(d=>`<tr>
        <td><a href="#" onclick="nav('trainer-detail',{id:'${d.TrainerID}'});return false;">${esc(trainerName(d.TrainerID))}</a></td>
        <td>${esc(moduleName(d.ModuleID))}</td><td>${esc(d.Topic)}</td><td>${fmt(d.DemoDate)}</td>
        <td class="actions"><a href="#" onclick="nav('add-demo',{trainerID:'${d.TrainerID}',moduleID:'${d.ModuleID}'});return false;">+ New Demo</a></td>
      </tr>`).join("")}
    </table></div></div>` : ""}
  `;
}

// ── Trainers list ─────────────────────────────────────────────
function trainers(m, params={}) {
  const mods = activeModules();
  const q = (params.q || "").toLowerCase();
  let list = activeTrainers();
  if (q) list = list.filter(t => t.Name.toLowerCase().includes(q));

  m.innerHTML = `
    <div class="page-head">
      <div><h1>Trainers</h1><div class="sub">${list.length} trainer${list.length!==1?"s":""}</div></div>
      <div class="btns"><button class="btn" onclick="showAddTrainer()">+ Add Trainer</button></div>
    </div>
    <div class="filters">
      <label>Search<input type="text" id="q-trainers" placeholder="Name" value="${esc(params.q||"")}"></label>
      <button class="btn" onclick="nav('trainers',{q:$('q-trainers').value})">Filter</button>
    </div>
    <div class="card"><div class="tbl-wrap"><table>
      <tr><th>Name</th><th>Vendor</th><th>Type</th><th>Status</th><th>Approved Modules</th><th></th></tr>
      ${list.map(t => {
        const eng = currentEngagement(t.TrainerID);
        const dec = trainerDecisions(t.TrainerID);
        const status = trainerStatus(dec, mods);
        const items = approvedItems(dec, mods);
        const tags = approvalTags(items);
        const badge = status === "ACTIVE" ? "green" : status === "PERM_REJECT_ALL" ? "red" : "amber";
        const statusLabel = status === "ACTIVE" ? "Active" : status === "PERM_REJECT_ALL" ? "PSG Rejected" : "Module Rejected";
        return `<tr>
          <td><a href="#" onclick="nav('trainer-detail',{id:'${t.TrainerID}'});return false;"><b>${esc(t.Name)}</b></a></td>
          <td>${eng ? esc(vendorName(eng.VendorID)) : '<span class="muted">-</span>'}</td>
          <td>${eng ? (eng.Type === "FT" ? "Full-time" : "Freelancer") : '<span class="muted">-</span>'}</td>
          <td><span class="badge ${badge}">${statusLabel}</span></td>
          <td>${tags.map(tg=>`<span class="tag">${esc(tg)}</span>`).join("") || '<span class="muted">-</span>'}</td>
          <td class="actions"><a href="#" onclick="nav('trainer-detail',{id:'${t.TrainerID}'});return false;">View</a></td>
        </tr>`;
      }).join("") || `<tr><td colspan="6" class="empty">No trainers found.</td></tr>`}
    </table></div></div>
  `;
}

// ── Active Trainers ───────────────────────────────────────────
function active(m, params={}) {
  const mods = activeModules();
  const statusFilter = params.status || "active";
  const vendorFilter = params.vendor || "";
  const moduleFilter = params.module || "";
  const typeFilter   = params.type   || "";

  const rows = [];
  activeTrainers().forEach(t => {
    const eng = currentEngagement(t.TrainerID);
    const dec = trainerDecisions(t.TrainerID);
    const status = trainerStatus(dec, mods);
    const items = approvedItems(dec, mods);
    const tags = approvalTags(items);
    const rejMods = rejectedModulesList(dec, mods);

    const statusMatch = statusFilter === "active" ? (status === "ACTIVE" && eng) :
                        statusFilter === "psg"    ? status === "PERM_REJECT_ALL" :
                        statusFilter === "module" ? status === "PERM_REJECT_MODULES" : true;
    if (!statusMatch) return;

window.exportActiveCSV = function() {
  const mods = activeModules();
  const rows = [["Trainer","Phone","Email","Vendor","Type","With us since","Status","Approved modules","Rejected modules"]];
  activeTrainers().forEach(t => {
    const eng = currentEngagement(t.TrainerID);
    const dec = trainerDecisions(t.TrainerID);
    const status = trainerStatus(dec, mods);
    const items = approvedItems(dec, mods);
    const tags = approvalTags(items);
    const rejMods = rejectedModulesList(dec, mods);
    const statusLabel = status==="ACTIVE"?"Active":status==="PERM_REJECT_ALL"?"PSG Rejected":"Module Rejected";
    rows.push([t.Name, t.Phone||"", t.Email||"", eng?vendorName(eng.VendorID):"", eng?(eng.Type==="FT"?"Full-time":"Freelancer"):"", eng?eng.StartDate:"", statusLabel, tags.join("; "), rejMods.map(m=>m.Name).join("; ")]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8"}));
  a.download = "active_trainers.csv"; a.click();
};

function trainerDetail(m, params={}) {
  const tid = String(params.id);
  const t = DB.trainers.find(x => String(x.TrainerID) === tid);
  if (!t) { m.innerHTML = "<p>Trainer not found.</p>"; return; }

  const mods = activeModules();
  const dec = trainerDecisions(tid);
  const cells = levelCells(dec, mods);
  const eng = currentEngagement(tid);
  const engHistory = DB.engagements.filter(e => String(e.TrainerID) === tid).sort((a,b)=>new Date(b.StartDate)-new Date(a.StartDate));
  const trainerDemos = DB.demos.filter(d => String(d.TrainerID) === tid).sort((a,b)=>new Date(b.DemoDate)-new Date(a.DemoDate)||Number(b.DemoID)-Number(a.DemoID));
  const trainerFeedback = DB.feedback.filter(f => String(f.TrainerID) === tid).sort((a,b)=>new Date(b.TrainingDate)-new Date(a.TrainingDate));

  const moduleRows = mods.map(mod => {
    const mid = String(mod.ModuleID);
    const cell = cells[mid] || { UG: null, PG: null };
    const selectedLevels = ["UG","PG"].filter(lv => cell[lv] && cell[lv].Status === "SELECTED");
    const ctrlDec = cell["UG"] || cell["PG"];
    const lastDemo = trainerDemos.find(d => String(d.ModuleID) === mid);
    return { mod, selectedLevels, ctrlDec, lastDemo };
  });

  const demoResultLabel = d => {
    if (d.Outcome === "SELECTED") return `Selected for ${d.Level}`;
    if (d.Outcome === "PERM_REJECT") return d.RejectScope === "PSG" ? "Rejected for PSG (permanent)" : "Rejected for module (permanent)";
    if (d.Outcome === "REJECTED") return "Rejected (may present again)";
    if (d.Outcome === "REDO") return "Redo";
    return d.Outcome;

  const demoBadge = d => ({SELECTED:"green",REJECTED:"amber",REDO:"blue",PERM_REJECT:"red"}[d.Outcome]||"grey");

  m.innerHTML = `
    <div class="page-head">
      <div><h1>${esc(t.Name)}</h1>

        <button class="btn ghost sm" onclick="showChangeEngagement('${tid}')">Change Vendor/Type</button>
      </div>
    </div>

    <div class="jump">
      <a href="#sec-status">Status by module</a>
      <a href="#sec-vendor">Vendor history</a>
      <a href="#sec-demos">Demos</a>
      <a href="#sec-feedback">Feedback</a>
    </div>

    <div class="card" id="sec-status">
      <div class="card-head"><h2>Status by module</h2></div>
      <div class="tbl-wrap"><table>
        <tr><th>Module</th><th>Current status</th><th>Last demo</th></tr>
        ${moduleRows.map(({mod,selectedLevels,ctrlDec,lastDemo})=>`<tr>
          <td><b>${esc(mod.Name)}</b></td>
          <td>${selectedLevels.length?`<span class="badge green">Selected for ${selectedLevels.length===2?"All":selectedLevels[0]}</span>`
              :ctrlDec?`<span class="badge ${{PERM_REJECT:"red",REJECTED:"amber",REDO:"blue",REMOVED:"red"}[ctrlDec.Status]||"grey"}">${{PERM_REJECT:"Permanently rejected",REJECTED:"Rejected",REDO:"Redo",REMOVED:"Removed",SELECTED:"Selected"}[ctrlDec.Status]||ctrlDec.Status}</span>${!ctrlDec.ModuleID?'<div class="muted" style="font-size:11px">applies to all modules (PSG)</div>':""}`
              :`<span class="badge grey">Not decided</span>`}</td>
          <td>${lastDemo?`<span class="badge ${demoBadge(lastDemo)}">${esc(demoResultLabel(lastDemo))}</span><div class="muted" style="font-size:11px">${fmt(lastDemo.DemoDate)}</div>`:'<span class="muted">-</span>'}</td>

window.toggleDemoFields = function() {
  const outcome = $("d-outcome").value;
  $("d-level-row").classList.toggle("hidden", outcome !== "SELECTED");
  $("d-scope-row").classList.toggle("hidden", outcome !== "PERM_REJECT");
};

window.updateScoreFields = function() {
  const modID = $("d-module") ? $("d-module").value : "";
  const sec = $("score-section");
  const tbl = $("score-table");
  if (!modID || !sec || !tbl) return;
  const criteriaFields = DB.fields.filter(f => String(f.ModuleID) === modID && (f.Active===true||f.Active==="TRUE"||f.Active==="true")).sort((a,b)=>Number(a.DisplayOrder)-Number(b.DisplayOrder));
  if (!criteriaFields.length) { sec.classList.add("hidden"); return; }
  sec.classList.remove("hidden");
  const existing = tbl.querySelectorAll("tr.score-row");
  existing.forEach(r=>r.remove());
  criteriaFields.forEach(f => {
    const tr = document.createElement("tr");
    tr.className = "score-row";
    tr.dataset.fieldId = f.FieldID;
    tr.dataset.min = f.MinMarks;
    tr.dataset.max = f.MaxMarks;
    tr.dataset.criterion = f.Criterion;
    tr.innerHTML = `<td>${esc(f.Criterion)}</td><td><input type="number" min="${f.MinMarks}" max="${f.MaxMarks}" step="1" value="${f.MinMarks}" oninput="calcTotal()"></td><td class="max-lbl">/ ${f.MaxMarks}</td>`;
    tbl.appendChild(tr);
  });
  calcTotal();
};

window.calcTotal = function() {
  const tot = $("score-total");
  if (!tot) return;
  let score = 0, max = 0;
  document.querySelectorAll(".score-row").forEach(tr => {
    score += Number(tr.querySelector("input").value)||0;
    max   += Number(tr.dataset.max)||0;
  });
  tot.textContent = max ? `Total: ${score} / ${max}` : "";
};

window.submitDemo = async function() {
  const trainer = $("d-trainer").value;
  const module  = $("d-module").value;
  const outcome = $("d-outcome").value;
  const errEl   = $("demo-err");
  if (!trainer||!module||!outcome) { errEl.textContent="Please fill Trainer, Module and Outcome."; errEl.classList.remove("hidden"); return; }
  if (outcome==="PERM_REJECT" && !$("d-remarks").value.trim()) { errEl.textContent="Please write the reason for a permanent rejection."; errEl.classList.remove("hidden"); return; }

  const scores = [];
  document.querySelectorAll(".score-row").forEach(tr => {
    scores.push({ FieldID: tr.dataset.fieldId, Criterion: tr.dataset.criterion, Score: Number(tr.querySelector("input").value)||0, MinAtTime: Number(tr.dataset.min), MaxAtTime: Number(tr.dataset.max) });
  });

  const payload = {
    action: "addDemo",
    TrainerID:   trainer,
    ModuleID:    module,
    Topic:       $("d-topic").value.trim(),
    DemoDate:    $("d-date").value,
    Outcome:     outcome,
    Level:       outcome==="SELECTED" ? $("d-level").value : "ALL",
    RejectScope: outcome==="PERM_REJECT" ? $("d-scope").value : "",
    Evaluator:   $("d-evaluator").value.trim(),
    Remarks:     $("d-remarks").value.trim(),
    Scores:      scores
  };
  try {
    showLoading(true);
    await apiPost(payload);
    await loadAll();
    showToast("Demo saved.");
    nav("trainer-detail", { id: trainer });
  } catch(e) { errEl.textContent = e.message; errEl.classList.remove("hidden"); }
  showLoading(false);
};

function vendors(m) {
  m.innerHTML = `
    <div class="page-head"><div><h1>Vendors</h1></div><button class="btn" onclick="showAddVendor()">+ Add Vendor</button></div>
    <div class="card"><div class="tbl-wrap"><table>
      <tr><th>Name</th><th>Contact</th><th>Phone</th><th>Email</th><th>Active</th></tr>
      ${DB.vendors.map(v=>`<tr>
        <td><b>${esc(v.Name)}</b></td><td>${esc(v.ContactPerson)}</td><td>${esc(v.Phone)}</td><td>${esc(v.Email)}</td>
        <td>${v.Active===true||v.Active==="TRUE"||v.Active==="true"?'<span class="badge green">Yes</span>':'<span class="badge grey">No</span>'}</td>
      </tr>`).join("")||`<tr><td colspan="5" class="empty">No vendors.</td></tr>`}
    </table></div></div>
  `;
}

// ── Fields ────────────────────────────────────────────────────
function fields(m) {
  const mods = DB.modules;
  m.innerHTML = `
    <div class="page-head"><div><h1>Evaluation Fields</h1><div class="sub">Criteria used to score demos per module.</div></div><button class="btn" onclick="showAddField()">+ Add Field</button></div>
    ${mods.map(mod => {
      const modFields = DB.fields.filter(f=>String(f.ModuleID)===String(mod.ModuleID)).sort((a,b)=>Number(a.DisplayOrder)-Number(b.DisplayOrder));
      return `<div class="card">
        <div class="card-head"><h2>${esc(mod.Name)}</h2></div>
        ${modFields.length?`<div class="tbl-wrap"><table>
          <tr><th>Criterion</th><th>Min</th><th>Max</th><th>Order</th><th>Active</th><th></th></tr>
          ${modFields.map(f=>`<tr>
            <td>${esc(f.Criterion)}</td><td>${f.MinMarks}</td><td>${f.MaxMarks}</td><td>${f.DisplayOrder}</td>
            <td>${f.Active===true||f.Active==="TRUE"||f.Active==="true"?'<span class="badge green">Yes</span>':'<span class="badge grey">No</span>'}</td>
            <td class="actions"><a href="#" onclick="showEditField('${f.FieldID}');return false;">Edit</a></td>
          </tr>`).join("")}
        </table></div>`:`<div class="empty">No fields for this module yet.</div>`}
      </div>`;
    }).join("")||`<div class="empty">No modules.</div>`}
  `;
}

window.showAddTrainer = function() {
  openModal(`
    <h2>Add Trainer</h2>
    <div class="form-grid">
      <div class="field full"><label class="lbl">Name *</label><input type="text" id="at-name"></div>
      <div class="field"><label class="lbl">Phone</label><input type="text" id="at-phone"></div>
      <div class="field"><label class="lbl">Email</label><input type="email" id="at-email"></div>
      <div class="field">
        <label class="lbl">Vendor *</label>
        <select id="at-vendor">
          <option value="">-- select --</option>
          ${activeVendors().map(v=>`<option value="${v.VendorID}">${esc(v.Name)}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label class="lbl">Type *</label>
        <select id="at-type"><option value="FT">Full-time</option><option value="FL">Freelancer</option></select>
      </div>
      <div class="field full"><label class="lbl">Notes</label><textarea id="at-notes"></textarea></div>
    </div>
    <div class="form-actions">
      <button class="btn" onclick="submitAddTrainer()">Save</button>
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
    </div>
    <div class="error-msg hidden" id="at-err"></div>
  `);
};

window.submitAddTrainer = async function() {
  const name = $("at-name").value.trim(), vendor = $("at-vendor").value;
  if (!name||!vendor) { $("at-err").textContent="Name and Vendor are required."; $("at-err").classList.remove("hidden"); return; }
  try {
    showLoading(true);
    const res = await apiPost({ action:"addTrainer", Name:name, Phone:$("at-phone").value.trim(), Email:$("at-email").value.trim(), VendorID:vendor, Type:$("at-type").value, Notes:$("at-notes").value.trim(), StartDate:fmtToday() });
    await loadAll(); closeModal(); showToast("Trainer added.");
    nav("trainer-detail", { id: res.TrainerID });
  } catch(e) { $("at-err").textContent=e.message; $("at-err").classList.remove("hidden"); }
  showLoading(false);
};

window.showAddField = function() {
  openModal(`
    <h2>Add Evaluation Field</h2>
    <div class="form-grid">
      <div class="field full">
        <label class="lbl">Module *</label>
        <select id="af-module">
          <option value="">-- select --</option>
          ${DB.modules.map(mod=>`<option value="${mod.ModuleID}">${esc(mod.Name)}</option>`).join("")}
        </select>
      </div>
      <div class="field full"><label class="lbl">Criterion *</label><input type="text" id="af-crit" placeholder="e.g. Communication"></div>
      <div class="field"><label class="lbl">Min Marks</label><input type="number" id="af-min" value="0" min="0"></div>
      <div class="field"><label class="lbl">Max Marks</label><input type="number" id="af-max" value="10" min="1"></div>
      <div class="field"><label class="lbl">Display Order</label><input type="number" id="af-order" value="1" min="1"></div>
    </div>
    <div class="form-actions">
      <button class="btn" onclick="submitAddField()">Save</button>
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
    </div>
    <div class="error-msg hidden" id="af-err"></div>
  `);
};

window.submitAddField = async function() {
  const module = $("af-module").value, crit = $("af-crit").value.trim();
  if (!module||!crit) { $("af-err").textContent="Module and Criterion are required."; $("af-err").classList.remove("hidden"); return; }
  try {
    showLoading(true);
    await apiPost({ action:"addField", ModuleID:module, Criterion:crit, MinMarks:Number($("af-min").value)||0, MaxMarks:Number($("af-max").value)||10, DisplayOrder:Number($("af-order").value)||1 });
    await loadAll(); closeModal(); showToast("Field added."); nav("fields");
  } catch(e) { $("af-err").textContent=e.message; $("af-err").classList.remove("hidden"); }
  showLoading(false);
};

window.showEditField = function(fid) {
  const f = DB.fields.find(x=>String(x.FieldID)===String(fid));
  if (!f) return;
  openModal(`
    <h2>Edit Field</h2>
    <div class="form-grid">
      <div class="field full"><label class="lbl">Criterion *</label><input type="text" id="ef-crit" value="${esc(f.Criterion)}"></div>
      <div class="field"><label class="lbl">Min Marks</label><input type="number" id="ef-min" value="${f.MinMarks}"></div>
      <div class="field"><label class="lbl">Max Marks</label><input type="number" id="ef-max" value="${f.MaxMarks}"></div>
      <div class="field"><label class="lbl">Display Order</label><input type="number" id="ef-order" value="${f.DisplayOrder}"></div>
      <div class="field"><label class="lbl">Active</label><select id="ef-active"><option value="TRUE" ${f.Active===true||f.Active==="TRUE"||f.Active==="true"?"selected":""}>Yes</option><option value="FALSE" ${!(f.Active===true||f.Active==="TRUE"||f.Active==="true")?"selected":""}>No</option></select></div>
    </div>
    <div class="form-actions">
      <button class="btn" onclick="submitEditField('${fid}')">Save</button>
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
    </div>
    <div class="error-msg hidden" id="ef-err"></div>
  `);
};

window.submitEditField = async function(fid) {
  const crit = $("ef-crit").value.trim();
  if (!crit) { $("ef-err").textContent="Criterion is required."; $("ef-err").classList.remove("hidden"); return; }
  try {
    showLoading(true);
    await apiPost({ action:"updateField", FieldID:fid, Criterion:crit, MinMarks:Number($("ef-min").value), MaxMarks:Number($("ef-max").value), DisplayOrder:Number($("ef-order").value), Active:$("ef-active").value==="TRUE" });
    await loadAll(); closeModal(); showToast("Field updated."); nav("fields");
  } catch(e) { $("ef-err").textContent=e.message; $("ef-err").classList.remove("hidden"); }
  showLoading(false);
};
